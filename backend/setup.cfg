[flake8]
max-line-length = 119
extend-ignore = E203, W503
exclude = migrations,venv,.venv,__pycache__
per-file-ignores =
    # Django's split-settings pattern (base/dev/prod/test) relies on
    # `from .base import *`, which flake8's F405 flags as "may be
    # undefined" for every name it can't statically resolve. This is the
    # standard, intentional pattern for layered Django settings.
    config/settings/dev.py:F405
    config/settings/prod.py:F405
    config/settings/test.py:F405
