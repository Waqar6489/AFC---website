<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AFC - Ahmad Foods{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#000000;padding:24px 32px;">
              <span style="color:#F5C518;font-size:22px;font-weight:700;letter-spacing:0.5px;">AFC</span>
              <span style="color:#ffffff;font-size:13px;display:block;margin-top:2px;">Ahmad Foods — Sweets &amp; Bakers</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#1a1a1a;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background-color:#f0f0f0;padding:20px 32px;color:#777777;font-size:12px;text-align:center;">
              &copy; {% now "Y" %} AFC - Ahmad Foods. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
